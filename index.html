<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8faf9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="脉安血压数据同步、趋势与个性化健康提示" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>脉安 · AI 血压管家</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-label="脉安">
          <span class="brand-pulse"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="brand-name">脉安</span>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" data-action="open-notifications" aria-label="通知">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
            <span class="notification-dot"></span>
          </button>
          <button class="profile-avatar" data-nav="profile" aria-label="打开个人资料">林</button>
        </div>
      </header>

      <main id="view-root" class="view-root" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item is-active" data-nav="home">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9Z"/><path d="M9 20v-6h6v6"/></svg></span>
          <span>首页</span>
        </button>
        <button class="nav-item" data-nav="trend">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h17"/><path d="m7 15 3-4 3 2 5-7"/></svg></span>
          <span>血压记录</span>
        </button>
        <button class="nav-item" data-nav="profile">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.4 3-5 7-5s6.2 1.6 7 5"/></svg></span>
          <span>我的</span>
        </button>
      </nav>
    </div>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
